<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>app</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
    crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/img/styles/estilos.css">
</head>
<body>
    <header>

    </header>
    <main>
        <section class="banner"></section>

        <section class="container my-5">
            <section class="row justyfi-content-center">
                <section class="col-12 col-md-8">
                    <h2>tienda CHEVIGNON</h2>
                    <h3>Registro de ventas en ela sucrsal sandiego</h3>
                    <br>
                    <form class="p-5 border rounded shadow">

                         <select class="form-select mb-3">
                            <option selected>seleccione un vendedor</option>
                            <option value="1">julieth tuberquia</option>
                            <option value="2">isamel ocampo</option>
                            <option value="3">sofia tuberquia</option>
                        </select>
                        <div class="row">
                            <div class="col-6">
                               <input type="date" class="mb-3 form-control"> 
                            </div>
                            <div class="col-6">
                               <input type="text" placeholder="centro comecial (local)" class="mb-3 form-control">
                            </div>
                        </div>
                        

                         <div class="row">
                            <div class="col-6">
                               <div class="form-floating">
                                 <textarea class="form-control" placeholder="productos de la compra"
                                  id="floatingTextarea"></textarea>
                                 <label for="floatingTextarea">productos</label>
                               </div>
                            </div>
                            <div class="col-6 aling-self-center ">
                               <input type="number" placeholder="costoTotal" class="mb-3 form-control">
                            </div>
                        </div>


                        <button type="submit" class="btn btn-primary w-100 m-3">Registrar Ventas</button>


 

                    </form>

                </section> 

            </section>

        </section>
    </main>
    <footer>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
     integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
